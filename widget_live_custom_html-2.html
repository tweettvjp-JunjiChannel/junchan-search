<div style="margin-top:14px;padding:12px 14px;background:#f5f5f5;border:1px solid #e0e0e0;border-radius:8px;font-size:0.85em;line-height:1.7;color:#555;"><p style="margin:0 0 4px;font-weight:bold;color:#444;">🔑 すでにサブスク加入・ご購入済みの方へ</p><p style="margin:0 0 10px;">別端末やPCでログイン後も記事が「購入画面」のまま開かない場合は、記事本文の上にある【購入を復元する】ボタンを押してください。（Codocの仕様により認証の再同期が必要です）</p><a href="https://codoc.jp/login" target="_blank" rel="noopener" style="display:inline-block;padding:8px 16px;background:#333;color:#fff;text-decoration:none;border-radius:6px;font-weight:bold;font-size:0.95em;">🔑 Codocにログインする</a></div>
<script>
(function () {
  // 【2026-09-07追記：月間サブスク解約後の利用期限ステータス表示】
  // Codoc公式スクリプト(cms.js/cms-core.js)を実機で取得・解析した結果、
  // このサブスクボタン（.codoc-siteSubscription-subscription 内の
  // .codoc-btn）は、ログイン中ブラウザが当該サブスクを「所有している」
  // （Vueコンポーネント内部の ownedSubscription フラグ）場合に限り、
  // クラスへ "codoc-btn-disable" が追加されて灰色化することをソース上で
  // 確認済み（サブスク購入エンドポイント自体には次回更新日・利用終了日は
  // 一切含まれておらず、「現に利用権があるか」の真偽値しか取得できない。
  // そのため、"継続中の現役購読" と "解約済みだが期限までは利用できる
  // 状態" をこの灰色化だけから区別することは技術的に不可能と判明した）。
  // よって、①ウィジェット内に万一具体的な日付テキストが検出できた場合の
  // みそれを主役にした赤字の期限表示を行い、②検出できない場合（現状の
  // 大半のケース）は「解約済み」等の確認しようのない状態を断定せず、
  // 「現在ご利用いただけています」という常に真である事実と、正確な
  // 次回更新日・解約状況の確認先（/account/）だけを案内する、読者を
  // 不安にさせない安全な表示にする。
  var DATE_PATTERN = /(\d{4}年)?\d{1,2}月\d{1,2}日/;
  var CANCEL_HINT_PATTERN = /(解約|キャンセル|更新停止|利用終了|次回)/;
  var STATUS_ID = 'nseb-codoc-sub-status';

  function findButton() {
    return document.querySelector('#custom_html-2 .codoc-siteSubscription-subscription .codoc-price .codoc-btn');
  }
  function findWidgetRoot() {
    return document.querySelector('#custom_html-2 .codoc-siteSubscription-subscription');
  }
  function extractDateNearby(root) {
    var text = root.textContent || '';
    var m = DATE_PATTERN.exec(text);
    if (!m) { return null; }
    // 日付の前後60文字以内に解約関連語があるかを確認し、無関係な日付
    // （記事タイトル中の数字等）を誤って拾わないようにする。
    var idx = m.index;
    var context = text.slice(Math.max(0, idx - 60), idx + 60);
    if (!CANCEL_HINT_PATTERN.test(context)) { return null; }
    return m[0];
  }
  function removeStatus() {
    var el = document.getElementById(STATUS_ID);
    if (el && el.parentNode) { el.parentNode.removeChild(el); }
  }
  function insertStatus(root, dateText) {
    removeStatus();
    var box = document.createElement('div');
    box.id = STATUS_ID;
    if (dateText) {
      box.style.cssText = 'margin-top:10px;padding:8px 10px;background:#fdecea;border:2px solid #c0392b;border-radius:8px;text-align:center;';
      box.innerHTML = '<span style="color:#c0392b;font-weight:bold;font-size:0.92em;">🔴 ' + dateText + 'まで読み放題（解約済み）</span>';
    } else {
      box.style.cssText = 'margin-top:10px;padding:8px 10px;background:#eafaf1;border:1px solid #2ecc71;border-radius:8px;text-align:center;';
      box.innerHTML = '<span style="color:#1e8449;font-weight:bold;font-size:0.88em;">✅ 現在ご利用いただけています</span><br>'
        + '<a href="https://junchan-world.com/account/" style="color:#c0392b;font-weight:bold;font-size:0.82em;text-decoration:underline;">▶ 正確な次回更新日・解約状況の確認はこちら</a>';
    }
    if (root.parentElement) { root.parentElement.insertBefore(box, root.nextSibling); }
  }

  var mo;
  function check() {
    var btn = findButton();
    var root = findWidgetRoot();
    if (!btn || !root) { removeStatus(); return; }
    var owned = btn.classList.contains('codoc-btn-disable');
    // 自分自身のDOM挿入・削除がMutationObserverを再度発火させ無限ループに
    // なるのを防ぐため、DOM操作中だけ監視を一時停止する。
    if (mo) { mo.disconnect(); }
    if (!owned) {
      removeStatus();
    } else {
      insertStatus(root, extractDateNearby(root));
    }
    if (mo) { mo.observe(target, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] }); }
  }

  var target = document.querySelector('#custom_html-2') || document.body;
  var debounceTimer = null;
  mo = new MutationObserver(function () {
    if (debounceTimer) { clearTimeout(debounceTimer); }
    debounceTimer = setTimeout(check, 80);
  });
  mo.observe(target, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
  check();
})();
</script>
